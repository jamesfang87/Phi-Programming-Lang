name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-llvm
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead-code

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: ./.github/actions/install-llvm
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Run tests
        run: |
          set -o pipefail
          cargo test --all --verbose 2>&1 | tee test-output.log
      - name: Report failing tests
        if: failure()
        run: |
          awk '/panicked at/ { msg = $0; for (i = 0; i < 4 && (getline line) > 0; i++) msg = msg " " line; print "::error::" msg }' test-output.log | head -10
